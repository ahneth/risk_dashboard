# Version: 2.0.1 | Last Modified: 2026-11-23 09:38 HKT
# File: .github/workflows/update-fred.yml
# Description: GitHub Actions workflow to refresh data/fred_cache.json every 4 hours
#              at minute 14 (off-peak) to avoid top-of-the-hour queue delays.
# Change Log:
#   - 2.0.1 (2026-11-23 09:38 HKT): Standalone repo version sync.
#   - 2.0.0 (2026-11-23 08:41 HKT): Updated schedule to 14 */4 * * *.
#   - 1.0.0 (2026-08-01 00:00 HKT): Initial daily workflow.

name: Update FRED Data Cache

on:
  schedule:
    # Runs at 14 minutes past the hour, every 4 hours to avoid queue delays
    - cron: '14 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch FRED Data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/update-fred.mjs

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fred_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update FRED cache [skip ci]" && git push)
